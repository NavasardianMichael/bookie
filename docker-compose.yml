services:
  postgres:
    image: postgres:16-alpine
    container_name: bookie-postgres
    restart: unless-stopped
    ports:
      # Host 5004 — the same port production publishes, so DATABASE_URL differs
      # between the two only by host and password. Still deliberately not 5432: a
      # devdb02 SSH tunnel commonly holds 127.0.0.1:5432 on dev machines, which
      # shadows Docker's bind and breaks Prisma auth.
      - '5004:5432'
    environment:
      POSTGRES_USER: bookie
      POSTGRES_PASSWORD: bookie
      POSTGRES_DB: bookie
    volumes:
      - bookie_pg:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U bookie -d bookie']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  bookie_pg:
