# Production Postgres. Lives at $APP_DIR/db/docker-compose.prod.yml on the host
# and is started once, by hand — the deploy workflow never touches it.
#
#   cd $APP_DIR/db
#   POSTGRES_PASSWORD=... docker compose -f docker-compose.prod.yml up -d
#
# This is deliberately separate from the repo's root docker-compose.yml, which is
# the dev database (same port, throwaway credentials, different machine).

name: bookie-prod

services:
  postgres:
    image: postgres:16-alpine
    container_name: bookie-postgres-prod
    restart: unless-stopped
    ports:
      # host:container. 5004 rather than 5432 because the target server already
      # has a Postgres on 5432. Loopback only — nothing outside the host should
      # ever reach it.
      - '127.0.0.1:5004:5432'
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bookie}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-bookie}
    volumes:
      - bookie_pg_prod:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-bookie} -d ${POSTGRES_DB:-bookie}']
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

volumes:
  bookie_pg_prod:
