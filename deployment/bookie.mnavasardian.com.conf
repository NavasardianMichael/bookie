# =============================================================================
# nginx — web host (Next.js). Install to /etc/nginx/sites-available/bookie.mnavasardian.com.conf
# and symlink into sites-enabled. Serves bookie.mnavasardian.com; paths assume
# APP_DIR=/home/michael/apps/bookie.
#
# www.bookie.mnavasardian.com 301s here on both HTTP and HTTPS — do not proxy
# www, or CORS_ORIGIN / CSRF / canonicals see a second web origin.
#
# Every [lang] route is server-rendered on demand, so there is no static site to
# serve here: nginx proxies to the Next server and serves only the hashed build
# assets off disk.
# =============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name bookie.mnavasardian.com;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name www.bookie.mnavasardian.com;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://bookie.mnavasardian.com$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.bookie.mnavasardian.com;

    ssl_certificate     /etc/letsencrypt/live/bookie.mnavasardian.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bookie.mnavasardian.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://bookie.mnavasardian.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name bookie.mnavasardian.com;

    ssl_certificate     /etc/letsencrypt/live/bookie.mnavasardian.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bookie.mnavasardian.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Hashed, immutable build assets, served straight off disk. The path runs
    # through web/current, so a release swap is picked up with no nginx reload.
    location /_next/static/ {
        alias /home/michael/apps/bookie/web/current/.next/static/;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # /_next/image is the image optimizer, not a static path. It is deliberately
    # NOT matched above so it falls through to Node.

    location / {
        proxy_pass http://127.0.0.1:7004;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Next streams RSC payloads; buffering them defeats every Suspense
        # boundary and delays first paint until the whole render finishes.
        proxy_buffering off;

        # NEVER add proxy_cache to this block. src/proxy.ts answers unprefixed and
        # guarded requests with personalised 307s carrying
        # `Vary: Accept-Language, Cookie` and `Cache-Control: no-store` — caching
        # them pins the first visitor's language onto everybody else.

        proxy_read_timeout 60s;
    }

    gzip on;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript text/javascript application/xml image/svg+xml;
    gzip_min_length 256;
}
